<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Saleem - CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased pb-20">

    <!-- Responsive Header -->
    <header class="w-full bg-[#f4f8fb] sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-6 md:px-12 py-4 flex justify-between items-center">
            <!-- Logo -->
            <div class="logo">M</div>
            
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex gap-8 text-sm font-medium">
                <a href="#home" class="nav-link">Home</a>
                <a href="#education" class="nav-link">Education</a>
                <a href="#experience" class="nav-link">Experience</a>
                <a href="#projects" class="nav-link">Projects</a>
            </nav>

            <!-- Mobile Hamburger Button -->
            <button id="mobile-menu-btn" class="md:hidden flex flex-col justify-center items-center w-8 h-8 z-50 gap-1.5 focus:outline-none">
                <span class="w-6 h-0.5 bg-gray-900 rounded"></span>
                <span class="w-6 h-0.5 bg-gray-900 rounded"></span>
                <span class="w-6 h-0.5 bg-gray-900 rounded"></span>
            </button>
        </div>

        <!-- Mobile Slide-out Menu -->
        <div id="mobile-sidebar" class="fixed top-0 right-0 h-full w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-40 flex flex-col pt-24 px-8 gap-6 text-lg font-medium md:hidden">
            <a href="#home" class="mobile-nav-link">Home</a>
            <a href="#education" class="mobile-nav-link">Education</a>
            <a href="#experience" class="mobile-nav-link">Experience</a>
            <a href="#projects" class="mobile-nav-link">Projects</a>
        </div>
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-black bg-opacity-20 hidden z-30 transition-opacity md:hidden"></div>
    </header>

    <main class="max-w-5xl mx-auto px-6 md:px-12 pt-12">
        <!-- Dynamic content containers -->
        <div id="home-section"></div>
        <div id="education-section"></div>
        <div id="experience-section"></div>
        <div id="projects-section"></div>
    </main>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
